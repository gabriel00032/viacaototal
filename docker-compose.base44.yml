services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx next dev -H 0.0.0.0 -p 3000"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    labels:
      base44.project: "Viação Total"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    restart: on-failure

volumes:
  node_modules:
